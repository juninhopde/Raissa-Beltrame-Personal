<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada — Raissa Beltrame</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Manrope:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;display:grid;place-items:center;text-align:center;
  padding:40px 24px;background:radial-gradient(80% 60% at 50% 0%,rgba(231,196,99,.10),transparent 60%),#000;
  color:#f3efe7;font-family:"Manrope",system-ui,sans-serif;line-height:1.6;
}
h1{
  font-family:"Big Shoulders Display",sans-serif;font-weight:900;text-transform:uppercase;
  font-size:clamp(4.5rem,22vw,12rem);line-height:.85;margin:0 0 6px;letter-spacing:-.02em;
  background:linear-gradient(175deg,#f9ecbd,#e7c463 32%,#b98b23 62%,#7d5510);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
h2{font-family:"Big Shoulders Display",sans-serif;font-weight:700;text-transform:uppercase;font-size:1.6rem;margin:0 0 14px}
p{color:#a9a29a;max-width:46ch;margin:0 auto 30px}
a{
  display:inline-flex;align-items:center;gap:9px;padding:14px 28px;text-decoration:none;font-weight:700;
  background:linear-gradient(175deg,#f9ecbd,#e7c463 32%,#b98b23 62%,#7d5510);color:#120d02;
  transition:transform .25s;
}
a:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>Essa página saiu do treino</h2>
    <p>O endereço que você acessou não existe ou foi movido. Volte para o início e continue de lá.</p>
    <a href="/">Voltar ao início</a>
  </main>
</body>
</html>
